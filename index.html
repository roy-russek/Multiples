<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק לוח הכפל</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap');

    * { font-family: 'Heebo', sans-serif; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-12px); }
      40%       { transform: translateX(12px); }
      60%       { transform: translateX(-8px); }
      80%       { transform: translateX(8px); }
    }
    @keyframes bounce-in {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.1); opacity: 1; }
      80%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    @keyframes star-spin {
      0%   { transform: rotate(0deg) scale(0); opacity: 0; }
      50%  { transform: rotate(180deg) scale(1.3); opacity: 1; }
      100% { transform: rotate(360deg) scale(1); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }
    @keyframes confetti-fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .anim-pop    { animation: pop 0.4s ease; }
    .anim-shake  { animation: shake 0.5s ease; }
    .anim-bounce { animation: bounce-in 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    .anim-star   { animation: star-spin 0.7s ease forwards; }
    .anim-float  { animation: float 3s ease-in-out infinite; }

    .btn-submit {
      background: linear-gradient(135deg, #93c5fd, #3b82f6, #1d4ed8);
      box-shadow: 0 8px 0 #1e40af, 0 10px 20px rgba(59,130,246,0.4);
      transition: all 0.1s ease;
    }
    .btn-submit:hover  { transform: translateY(-3px); box-shadow: 0 11px 0 #1e40af, 0 14px 28px rgba(59,130,246,0.5); }
    .btn-submit:active { transform: translateY(5px);  box-shadow: 0 3px 0 #1e40af; }

    .btn-next {
      background: linear-gradient(135deg, #fde68a, #fbbf24, #d97706);
      box-shadow: 0 8px 0 #b45309, 0 10px 20px rgba(217,119,6,0.4);
      transition: all 0.1s ease;
    }
    .btn-next:hover  { transform: translateY(-3px); box-shadow: 0 11px 0 #b45309, 0 14px 28px rgba(217,119,6,0.5); }
    .btn-next:active { transform: translateY(5px);  box-shadow: 0 3px 0 #b45309; }

    .number-card {
      background: linear-gradient(135deg, #fff, #f0f4ff);
      box-shadow: 0 12px 40px rgba(99,102,241,0.2), 0 4px 12px rgba(0,0,0,0.1);
    }

    .score-badge {
      background: linear-gradient(135deg, #818cf8, #6366f1, #4f46e5);
      box-shadow: 0 4px 15px rgba(99,102,241,0.5);
    }

    .answer-input {
      border: 4px solid #818cf8;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
    }
    .answer-input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.25);
    }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confetti-fall linear forwards;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module" src="./game.js"></script>
</body>
</html>
